name: Temporary verify Lacuna issue 3

on:
  push:
    branches:
      - feat/offline-discovery-audit-3
    paths:
      - '.github/workflows/temp-verify-lacuna-3.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - name: Focused regression
        run: npx vitest run tests/unit/audit-discovery.test.ts
      - name: Offline discovery audit
        run: npm run audit:discovery
      - name: Typecheck
        run: npm run typecheck
      - name: Verified unit suite
        run: npm run test:verified
